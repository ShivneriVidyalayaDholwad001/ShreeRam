<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚩 राम नवमी पोस्टर</title>

<link href="https://fonts.googleapis.com/css2?family=Khand:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>

<style>
:root{
    --maroon:#660000;
    --saffron:#ff6600;
}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#fdfbfb,#ebedee);
    margin:0;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    color:var(--maroon);
    font-family:'Khand';
}

.container{
    max-width:1100px;
    width:100%;
    display:grid;
    grid-template-columns:1fr 1.2fr;
    gap:30px;
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(12px);
    padding:30px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:2px solid #eee;
    margin-top:5px;
}

button{
    padding:14px;
    border:none;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.btn-main{background:var(--maroon);color:white;}
.btn-whatsapp{background:#25D366;color:white;}

canvas{
    border-radius:15px;
    box-shadow:0 15px 30px rgba(0,0,0,0.2);
}

/* Mobile */
@media(max-width:768px){
    .container{
        grid-template-columns:1fr;
    }
}

#cropModal{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.85);
    justify-content:center;
    align-items:center;
    flex-direction:column;
}
</style>
</head>

<body>

<h1>🚩 राम नवमी उत्सव 🚩</h1>

<div class="container">

<div>
<label>नाव</label>
<input type="text" id="name" oninput="drawPoster()">

<label>विद्यार्थी ओळ</label>
<input type="text" id="tagline" value="मी मराठी शाळेचा विद्यार्थी" oninput="drawPoster()">

<label>शाळा</label>
<input type="text" id="school" value="शिवनेरी विद्यालय धोलवड" oninput="drawPoster()">

<label>संस्था</label>
<input type="text" id="org" value="ग्रामशिक्षण सेवा मंडळ धोलवड" oninput="drawPoster()">

<label>सध्याचे पद</label>
<input type="text" id="post" value="विद्यार्थी" oninput="drawPoster()">

<label>फोटो</label>
<input type="file" id="photo">

<button class="btn-main" onclick="download()">📥 डाउनलोड</button>
<button class="btn-whatsapp" onclick="share()">📲 WhatsApp</button>
</div>

<div>
<canvas id="canvas" width="1080" height="1920" style="width:100%"></canvas>
</div>

</div>

<div id="cropModal">
<img id="cropImg" style="max-width:300px;">
<br>
<button onclick="cropImage()">Use Photo</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let cropper;
let userImage=null;

// Images
const bg=new Image();
bg.src="ram.png";

const logo=new Image();
logo.src="school.jpg";

const shivajiLogo=new Image();
shivajiLogo.src="Screenshot 2026-03-22 112639.png";

// Upload + Crop
document.getElementById("photo").addEventListener("change",(e)=>{
    const reader=new FileReader();
    reader.onload=(event)=>{
        cropImg.src=event.target.result;
        cropModal.style.display="flex";

        if(cropper) cropper.destroy();
        cropper=new Cropper(cropImg,{aspectRatio:1});
    };
    reader.readAsDataURL(e.target.files[0]);
});

function cropImage(){
    const cropped=cropper.getCroppedCanvas();
    userImage=new Image();
    userImage.src=cropped.toDataURL();

    userImage.onload=()=>{
        cropModal.style.display="none";
        drawPoster();
    };
}

function drawPoster(){

    const name=nameInput.value || "तुमचे नाव";
    const tagline=taglineInput.value;
    const school=schoolInput.value;
    const org=orgInput.value;
    const post=postInput.value;

    ctx.clearRect(0,0,1080,1920);

    ctx.drawImage(bg,0,0,1080,1920);
    ctx.fillStyle="rgba(0,0,0,0.55)";
    ctx.fillRect(0,0,1080,1920);

    ctx.drawImage(logo,40,40,120,120);
    ctx.drawImage(shivajiLogo,920,40,120,120);

    ctx.textAlign="center";

    ctx.fillStyle="#FFD700";
    ctx.font="bold 100px Khand";
    ctx.fillText("🚩 श्रीराम नवमी 🚩",540,500);

    ctx.fillStyle="#fff";
    ctx.font="60px Khand";
    ctx.fillText("हार्दिक शुभेच्छा!",540,570);

    // Photo
    const cx=540,cy=920,r=280;

    if(userImage){
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx,cy,r,0,Math.PI*2);
        ctx.clip();

        const scale=Math.max((r*2)/userImage.width,(r*2)/userImage.height);
        const x=cx-(userImage.width*scale)/2;
        const y=cy-(userImage.height*scale)/2;

        ctx.drawImage(userImage,x,y,userImage.width*scale,userImage.height*scale);
        ctx.restore();
    }

    ctx.strokeStyle="#FFD700";
    ctx.lineWidth=15;
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.stroke();

    // TEXT
    ctx.fillStyle="#fff";
    ctx.font="bold 75px Khand";
    ctx.fillText(name,540,1320);

    ctx.fillStyle="#FFD700";
    ctx.font="40px Poppins";
    ctx.fillText(tagline,540,1390);

    ctx.fillStyle="#fff";
    ctx.font="36px Poppins";
    ctx.fillText(school,540,1450);

    ctx.fillText(org,540,1500);

    ctx.fillStyle="#FFD700";
    ctx.fillText(post,540,1550);

    // Footer
    let grad=ctx.createLinearGradient(0,1600,1080,1920);
    grad.addColorStop(0,"#ff6600");
    grad.addColorStop(1,"#660000");

    ctx.fillStyle=grad;
    ctx.fillRect(0,1600,1080,320);

    // जय श्रीराम
    ctx.fillStyle="#fff";
    ctx.font="100px Khand";
    ctx.fillText("॥ जय श्रीराम ॥",540,1700);

    // SLOGAN (NEW)
    ctx.fillStyle="#FFD700";
    ctx.font="50px Poppins";
    ctx.fillText("रामाचा आदर्श, मराठी संस्कार",540,1780);
    ctx.fillText("शाळेत वाढू दे विद्यार्थ्यांचा विस्तार!",540,1840);
}

// Download
function download(){
    const link=document.createElement("a");
    link.download="RamNavami_Poster.png";
    link.href=canvas.toDataURL();
    link.click();
}

// WhatsApp Share
function share(){
    canvas.toBlob(function(blob){
        const file=new File([blob],"poster.png",{type:"image/png"});

        if(navigator.canShare && navigator.canShare({files:[file]})){
            navigator.share({
                files:[file],
                title:"राम नवमी शुभेच्छा",
                text:"🚩 राम नवमी शुभेच्छा"
            });
        } else {
            download();
            alert("Direct share not supported. Download and share manually.");
        }
    });
}

// Fix IDs
const nameInput=document.getElementById("name");
const taglineInput=document.getElementById("tagline");
const schoolInput=document.getElementById("school");
const orgInput=document.getElementById("org");
const postInput=document.getElementById("post");

window.onload=drawPoster;
</script>

</body>
</html>
